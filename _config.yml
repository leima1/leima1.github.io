# Welcome to Jekyll Paper for Github
#
# This is the configuration file for your blog, please change these items after forked.

title: Leo Ma
email: your-email@example.com
name: Leo
description: >- # this means to ignore newlines until "baseurl:"
  PT, DPT, PhD
keywords:
  [
    Parkinson's disease,
    gait,
    posture,
    balance,
    EEG,
    intracranial EEG,
    deep brain stimulation,
    physical therapy,
    motor control,
    neurorehabilitation,
    virtual reality,
  ]
baseurl: '' # the subpath of your site, e.g. /`blog
url: 'https://leima1.github.io' # the base hostname & protocol for your site, e.g. http://example.com
domain: 'leima1.github.io' # the domain name for your site, e.g. example.com
language: en
# Supported languages list:
# en: English
# de: Deutsche (German)
# es: Español (Spanish)
# fr: Français (French)
# ja: 日本語 (Japanese)
# pt: Português (Portuguese)
# zh-cn: 简体中文 (Simplified Chinese)
# zh-tw: 繁體中文 (Traditional Chinese)

analytics: # the Google Analytics property ID, e.g. UA-XXXXX-Y

comments: false # enable comments
disqus: # disqus account

mathjax: true # Math support
diagram: true # Diagrams support

permalink: /:year/:month/:day/:title

sass:
  sass_dir: _sass
  style: expanded # compressed, compact, expanded or compressed

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from
